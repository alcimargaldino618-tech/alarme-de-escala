name: Gerar APK Android

on:
  workflow_dispatch:
  push:
    paths:
      - 'Alarme-de-Escala-Android-Offline-1.1.0.zip'
      - '.github/workflows/build-android.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Instalar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Extrair projeto
        run: |
          mkdir project
          unzip -q "Alarme-de-Escala-Android-Offline-1.1.0.zip" -d project

      - name: Localizar projeto React
        run: |
          PROJECT_DIR=$(find project -name package.json -not -path '*/node_modules/*' -print -quit | xargs dirname)
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Projeto encontrado em: $PROJECT_DIR"

      - name: Instalar dependências
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          npm install --legacy-peer-deps

      - name: Gerar aplicação web
        working-directory: ${{ env.PROJECT_DIR }}
        run: npm run build

      - name: Preparar arquivos para Capacitor
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          rm -rf dist-android
          mkdir -p dist-android
          if [ -d "dist" ]; then
            cp -R dist/. dist-android/
          fi
          echo "Conteúdo de dist:"
          ls -la dist || true
          echo "Conteúdo de dist-android:"
          ls -la dist-android || true
          

      - name: Adicionar plataforma Android
        working-directory: ${{ env.PROJECT_DIR }}
        run: npx cap add android

      - name: Sincronizar Capacitor
        working-directory: ${{ env.PROJECT_DIR }}
        run: npx cap sync android

      - name: Compilar APK
        working-directory: ${{ env.PROJECT_DIR }}/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Enviar APK
        uses: actions/upload-artifact@v4
        with:
          name: Alarme-de-Escala-APK
          path: ${{ env.PROJECT_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
